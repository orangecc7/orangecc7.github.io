<meta charset="utf-8">
{% include seo.html %}
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  document.documentElement.classList.replace('no-js', 'js');
  try {
    var savedTheme = localStorage.getItem('orange-theme');
    document.documentElement.dataset.theme = savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  } catch (error) {
    document.documentElement.dataset.theme = 'light';
  }
</script>
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/profile.css' | relative_url }}">

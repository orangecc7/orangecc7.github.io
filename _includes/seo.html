{% assign seo_description = page.excerpt | default: site.description | strip_html | strip_newlines %}
{% assign canonical_url = page.url | absolute_url %}
<title>{{ site.title | escape }} — AI Research</title>
<meta name="description" content="{{ seo_description | escape }}">
<meta name="author" content="{{ site.author.name | escape }}">
<link rel="canonical" href="{{ canonical_url }}">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="{{ site.title | escape }}">
<meta property="og:description" content="{{ seo_description | escape }}">
<meta property="og:url" content="{{ canonical_url }}">
<meta property="og:image" content="{{ '/images/orange-avatar.svg' | absolute_url }}">
<meta name="twitter:card" content="summary">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Person","name":{{ site.author.name | jsonify }},"alternateName":{{ site.author.nickname | jsonify }},"url":{{ site.url | jsonify }},"email":{{ site.author.email | jsonify }},"sameAs":[{{ site.author.googlescholar | jsonify }},"https://github.com/{{ site.author.github }}"]}
</script>
